<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TraXtion ReCapture — Mobile &amp; Tablet Mockup</title>
  <link rel="stylesheet" href="shell.css">
  <script>
    /* Opened on a real phone or tablet? Skip the simulator and run the app full screen.
       Add ?shell to the address to force the simulator. */
    (function () {
      var q = new URLSearchParams(location.search);
      if (q.has('shell')) return;
      var coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
      var small = Math.min(screen.width, screen.height) < 1100;
      if (coarse && small) location.replace('app.html' + (location.hash || ''));
    })();
  </script>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img src="assets/img/traxtion-logo.png" alt="TraXtion">
      <div><b>ReCapture</b><span>Mobile &amp; Tablet mockup · v001</span></div>
    </div>

    <div class="controls">
      <div class="group">
        <span class="glabel">Device</span>
        <div class="seg" id="deviceSeg" role="radiogroup" aria-label="Device">
          <button data-device="phone" title="Phone (P)"><svg viewBox="0 0 24 24"><path d="M8 2h8a2 2 0 012 2v16a2 2 0 01-2 2H8a2 2 0 01-2-2V4a2 2 0 012-2zm0 2v16h8V4H8zm3 13h2v2h-2v-2z"/></svg>Phone</button>
          <button data-device="tablet" title="Tablet (T)"><svg viewBox="0 0 24 24"><path d="M5 2h14a2 2 0 012 2v16a2 2 0 01-2 2H5a2 2 0 01-2-2V4a2 2 0 012-2zm0 2v16h14V4H5zm6 13h2v2h-2v-2z"/></svg>Tablet</button>
          <button data-device="both" title="Phone and tablet side by side (B)"><svg viewBox="0 0 24 24"><path d="M2 5h10a2 2 0 012 2v12a2 2 0 01-2 2H2a2 2 0 01-2-2V7a2 2 0 012-2zm0 2v12h10V7H2zm16-2h4a2 2 0 012 2v12a2 2 0 01-2 2h-4a2 2 0 01-2-2V7a2 2 0 012-2zm0 2v12h4V7h-4z"/></svg>Both</button>
        </div>
      </div>
      <button class="tbtn" id="rotateBtn" title="Rotate (R)"><svg viewBox="0 0 24 24"><path d="M7.1 7.1A7 7 0 0118.9 11H21a9 9 0 00-15.3-5.3L3 3v7h7L7.1 7.1zM16.9 16.9A7 7 0 015.1 13H3a9 9 0 0015.3 5.3L21 21v-7h-7l2.9 2.9z"/></svg><span>Rotate</span></button>
      <div class="group">
        <span class="glabel">Screen</span>
        <div class="seg" id="screenSeg" role="radiogroup" aria-label="Screen">
          <button data-screen="list" title="Follow-Up List (L)">Follow-Up List</button>
          <button data-screen="detail" title="Opportunity Detail (D)">Opportunity Detail</button>
        </div>
      </div>
      <label class="group">
        <span class="glabel">Scenario</span>
        <select id="scenario" aria-label="Daniel Ruiz scenario">
          <option value="red">Red rear Tires</option>
          <option value="green">All-green Tires</option>
        </select>
      </label>
    </div>

    <div class="right">
      <div class="seg small" id="zoomSeg" role="radiogroup" aria-label="Zoom">
        <button data-zoom="fit" title="Fit devices to the window">Fit</button>
        <button data-zoom="1" title="Actual size">100%</button>
      </div>
      <button class="tbtn" id="resetBtn" title="Reload with the original sample data">Reset</button>
      <button class="tbtn accent" id="notesBtn" aria-pressed="false" title="Design notes (N)"><svg viewBox="0 0 24 24"><path d="M6 2h8.6L20 7.4V20a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2zm2 9v1.7h8V11H8zm0 3.4v1.7h8v-1.7H8zm0 3.4v1.7h5.2v-1.7H8z"/></svg><span>Design notes</span></button>
      <a class="tbtn" href="app.html" target="_blank" rel="noopener" title="Open the app on its own — resize the browser to see it adapt"><span>Full screen</span><svg viewBox="0 0 24 24"><path d="M14 3h7v7h-2V6.4l-9.3 9.3-1.4-1.4L17.6 5H14V3zM5 5h5v2H5v12h12v-5h2v5a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z"/></svg></a>
    </div>
  </header>

  <div class="main">
    <main class="stage" id="stage">
      <div class="devices" id="devices"><div class="devices-inner" id="devicesInner"></div></div>
    </main>
    <aside class="notes" id="notes" aria-label="Design notes" hidden></aside>
  </div>

  <footer class="hint">
    <span><b>Use it like a phone:</b> drag or scroll to move, tap to open. Every icon is interactive.</span>
    <span class="keys"><kbd>P</kbd> Phone <kbd>T</kbd> Tablet <kbd>B</kbd> Both <kbd>R</kbd> Rotate <kbd>L</kbd>/<kbd>D</kbd> Screens <kbd>N</kbd> Notes</span>
  </footer>

  <script src="shell.js"></script>
</body>
</html>
