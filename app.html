  <div id="app" class="app">
    <!-- ============ FOLLOW-UP LIST ============ -->
    <section id="listScreen" class="screen list-screen" aria-label="Follow-Up List">
      <header class="app-header">
        <img class="logo" src="assets/img/traxtion-logo.png" alt="TraXtion">
        <div class="header-actions">
          <button class="icon-btn tap" data-act="notifications" aria-label="Notifications"><svg class="ic-bell"><use href="#i-bell"/></svg><span class="badge">3</span></button>
          <button class="icon-btn avatar tap" data-act="profile" aria-label="Profile">C</button>
        </div>
      </header>
      <div class="sheet">
        <div class="scroll" id="listScroll">
          <button class="card dealer-card tap" data-act="dealer"><svg class="ic-home"><use href="#i-home"/></svg><span>TraXtion Sales Demo</span><svg class="ic-chev"><use href="#i-chev"/></svg></button>
          <div class="module-switch" role="tablist" aria-label="App modules">
            <button class="tap" role="tab" data-act="scans">Scans</button>
            <button class="active" role="tab" aria-selected="true">ReCapture <span class="ms-badge" id="moduleBadge"></span></button>
          </div>
          <div class="list-title">
            <div><h1>Follow-Up List</h1><span id="resultCount" class="result-count"></span></div>
            <button class="link-btn tap" data-act="legend"><svg><use href="#i-info"/></svg>Icon legend</button>
          </div>
          <div class="list-toolbar" id="listToolbar">
            <div class="search-row">
              <label class="search-field"><svg><use href="#i-search"/></svg><input id="search" type="search" autocomplete="off" placeholder="Vehicle Owner, VIN, Plate, Vehicle…" aria-label="Search"><button class="clear-search tap" data-act="clear-search" aria-label="Clear search" hidden><svg><use href="#i-close"/></svg></button></label>
              <button class="square-btn tap" data-act="sort" aria-label="Sort"><svg><use href="#i-sort"/></svg></button>
            </div>
            <div class="chips hscroll" id="quickChips" role="tablist" aria-label="Quick views"></div>
          </div>
          <div id="activeFilters" class="active-filters"></div>
          <div id="cards" class="cards" aria-live="polite"></div>
          <div id="listEnd" class="list-end"></div>
        </div>
        <button class="fab tap" data-act="filter" aria-label="Filters"><svg><use href="#i-filter"/></svg><span class="fab-badge" id="filterBadge" hidden></span></button>
      </div>
    </section>

    <!-- ============ OPPORTUNITY DETAIL ============ -->
    <section id="detailScreen" class="screen detail-screen" aria-label="Opportunity Detail">
      <header class="app-header detail-header">
        <button class="icon-btn back-btn tap" data-act="back" aria-label="Back"><svg><use href="#i-back"/></svg></button>
        <h2 class="header-title">Opportunity Detail</h2>
        <button class="icon-btn tap" data-act="detail-menu" aria-label="More actions" id="detailMenuBtn"><svg><use href="#i-more"/></svg></button>
      </header>
      <div class="sheet detail-sheet">
        <div class="scroll" id="detailScroll"><div id="detailContent"></div></div>
        <nav class="action-bar" id="actionBar" aria-label="Primary actions"></nav>
      </div>
    </section>
  </div>

  <div id="overlay" class="overlay" hidden></div>
  <div id="bsheet" class="bsheet" role="dialog" aria-modal="true" hidden>
    <div class="bs-handle" aria-hidden="true"></div>
    <div class="bs-head"><h3 id="bsTitle"></h3><button class="icon-plain tap" data-act="close-sheet" aria-label="Close"><svg><use href="#i-close"/></svg></button></div>
    <div class="bs-body" id="bsBody"></div>
    <div class="bs-foot" id="bsFoot"></div>
  </div>
  <div id="dialog" class="dialog" role="alertdialog" aria-modal="true" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
